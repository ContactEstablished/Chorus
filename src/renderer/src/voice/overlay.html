<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Chorus dictation</title>
    <!--
      ⚠ THE SAME CSP AS index.html, COPIED VERBATIM AND DELIBERATELY NOT WIDENED.
      ImplementationSpec-5-3.md §3: "a second window with a laxer policy is a
      policy hole with a nice UI on it." If this ever needs to differ from the
      main window's, that is a decision with its own ruling, not an edit here.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:"
    />
    <!--
      The document's own box, reset here because this window deliberately does NOT
      load the main app's stylesheet (see overlay.ts). Without it the user agent's
      8px body margin makes the document 16px taller than the 96px window and the
      overlay grows a vertical scrollbar (reported 2026-08-19). The window is
      transparent and click-through, so the page paints nothing of its own.
    -->
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
      }

      /*
        ⚠ THE MARK'S FOUR FILLS, COPIED BECAUSE THIS WINDOW HAS NO app STYLESHEET.
        `ChorusMark.vue` paints with `var(--color-logo-bar-*)` and
        `var(--color-accent-jade)`. Those are declared in
        `src/renderer/src/assets/main.css`'s `@theme static` block, which this
        document deliberately does not load (see overlay.ts — pulling the app's
        stylesheet in would pull the app in). Undefined custom properties do not
        error: the rects would simply render with NO FILL, i.e. an invisible logo.

        main.css is the source of truth. `overlayTokens.test.ts` reads both files
        and fails if these four drift from it.
      */
      :root {
        --color-logo-bar-low: #3e4650;
        --color-logo-bar-mid: #4a535e;
        --color-logo-bar-high: #5a646f;
        --color-accent-jade: #3bcfae;
      }
    </style>
  </head>

  <body>
    <div id="overlay"></div>
    <script type="module" src="/src/voice/overlay.ts"></script>
  </body>
</html>
